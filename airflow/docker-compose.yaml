
# Airflow orchestration for MarketPulse
# Market data is stored in Neon PostgreSQL using root .env variables.
# Airflow metadata is stored separately in its own PostgreSQL container.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow

    # Market data PostgreSQL (Neon)
    POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in root .env}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}

    FRED_API_KEY: ${FRED_API_KEY:-}
    USE_MOCK_DATA: ${USE_MOCK_DATA:-false}

    _PIP_ADDITIONAL_REQUIREMENTS: "yfinance==1.5.1 fredapi==0.5.2 dbt-core==1.8.3 dbt-postgres==1.8.2 python-dotenv==1.0.1 pandas_market_calendars==5.4.0"

  volumes:
    - ./dags:/opt/airflow/dags
    - ../extraction:/opt/airflow/extraction
    - ../dbt:/opt/airflow/dbt
    - airflow_logs:/opt/airflow/logs

  networks:
    - market_net

  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  # Separate Airflow metadata database. Do not replace this with Neon.
  airflow-postgres:
    image: postgres:16
    container_name: airflow_metadata_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - market_net

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Tejas \
          --lastname Rastogi \
          --role Admin \
          --email tejas@example.com || true
        cp /opt/airflow/dbt/profiles.yml.example /opt/airflow/dbt/profiles.yml

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  market_net:
    external: true

volumes:
  airflow_pgdata:
  airflow_logs:
