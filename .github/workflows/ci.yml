name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: market_data
          POSTGRES_USER: market_user
          POSTGRES_PASSWORD: market_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: market_data
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_pass
      USE_MOCK_DATA: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check extraction/ dashboard/ airflow/dags/

      - name: Unit tests (mock data, no external APIs)
        run: pytest tests/ -v

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.yml.example ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: Run pipeline end-to-end against mock data
        run: python -m extraction.pipeline

      - name: dbt docs generate (catches doc/lineage errors too)
        working-directory: dbt
        run: dbt docs generate
