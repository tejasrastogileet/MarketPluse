name: Refresh live data

# Keeps the publicly deployed Streamlit dashboard's data current without
# needing an always-on Airflow deployment (a real Airflow scheduler is a
# persistent process, which costs money to run 24/7; a free-tier scheduled
# GitHub Actions job does not). The Airflow DAG in airflow/dags/ is the
# orchestration this would run on in a production deployment - see the
# "Why two schedulers?" section of the README for the full tradeoff writeup.

on:
  schedule:
    - cron: "30 21 * * 1-5"  # 21:30 UTC weekdays, after US market close
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      USE_MOCK_DATA: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.yml.example ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: Run full pipeline against live Postgres
        run: python -m extraction.pipeline
